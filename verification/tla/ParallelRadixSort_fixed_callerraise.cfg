\* Fixed run, spawn failure AND asynchronous exception in the caller. Expected: all listed properties hold (quiescent, no mutation after return).
CONSTANTS
    N = 4
    KeyBits = 3
    DigitBits = 2
    Workers = 3
    RunVariant = "fixed"
    SpawnCanFail = TRUE
    CallerCanRaise = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    BoundsOK
    ScatterWritesDisjoint
    WritesOnlyToDestination
    TablesPrivate
    NoDomainOutsideRun
    CorrectOnNormalReturn
    QuiescentOnReturn
    AllJoinedOnReturn
    SpawnFailureIsBenign
PROPERTIES
    NoMutationAfterReturn
    Termination
