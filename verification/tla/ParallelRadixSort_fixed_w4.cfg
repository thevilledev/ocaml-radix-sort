\* Fixed run, 4 workers, Domain.spawn may fail at any of the 3 spawns. Expected: all properties hold.
CONSTANTS
    N = 4
    KeyBits = 2
    DigitBits = 1
    Workers = 4
    RunVariant = "fixed"
    SpawnCanFail = TRUE
    CallerCanRaise = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    BoundsOK
    ScatterWritesDisjoint
    WritesOnlyToDestination
    TablesPrivate
    NoDomainOutsideRun
    CorrectOnNormalReturn
    QuiescentOnReturn
    AllJoinedOnReturn
    ContentsPreservedOnException
    SpawnFailureIsBenign
    ReturnsNormally
PROPERTIES
    NoMutationAfterReturn
    Termination
