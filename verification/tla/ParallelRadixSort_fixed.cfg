\* Fixed run, Domain.spawn may fail (first or second spawn). Expected: all properties hold; sort always returns normally and correctly.
CONSTANTS
    N = 4
    KeyBits = 3
    DigitBits = 2
    Workers = 3
    RunVariant = "fixed"
    SpawnCanFail = TRUE
    CallerCanRaise = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    BoundsOK
    ScatterWritesDisjoint
    WritesOnlyToDestination
    TablesPrivate
    NoDomainOutsideRun
    CorrectOnNormalReturn
    QuiescentOnReturn
    AllJoinedOnReturn
    ContentsPreservedOnException
    SpawnFailureIsBenign
    ReturnsNormally
PROPERTIES
    NoMutationAfterReturn
    Termination
